name: Changelog to the site

# Тексты «Что нового» лежат в самих приложениях. Как только они меняются — сразу уходят на сайт
# (там они видны только для уже выложенных версий, будущая появится вместе со сборкой).
on:
  push:
    branches: [main]
    paths: ["desktop/src/main/resources/changelog.json", "android/app/src/main/assets/changelog.json"]
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to the site
        env: { UPDATE_TOKEN: "${{ secrets.UPDATE_TOKEN }}", SITE_URL: "${{ secrets.SITE_URL }}" }
        run: |
          if [ -z "$UPDATE_TOKEN" ] || [ -z "$SITE_URL" ]; then echo "::warning::UPDATE_TOKEN / SITE_URL не заданы"; exit 0; fi
          for p in desktop:desktop/src/main/resources/changelog.json android:android/app/src/main/assets/changelog.json; do
            plat="${p%%:*}"; file="${p#*:}"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file" || { echo "::error file=$file::Некорректный JSON"; exit 1; }
            curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "Content-Type: application/json" \
                 --data-binary @"$file" "$SITE_URL/api/app/changelog?platform=$plat" || echo "::error::Сайт не принял $plat (сервер обновлён?)"
            echo
          done
