name: Windows MSI

on:
  push:
    paths: ["desktop/**", "shared/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить MSI на сайт (папка updates/)"
        type: boolean
        default: false
      channel:
        description: "Кому: beta — только тестировщику (по коду), stable — всем"
        type: choice
        options: [beta, stable]
        default: beta

jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageMsi 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Caused by|> .*" "$RUNNER_TEMP/build.log" | grep -v "^> Task" | head -40 |
            while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          echo "::error::--- tail ---"
          tail -25 "$RUNNER_TEMP/build.log" | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
      - name: Collect
        run: |
          # Full version (2.0.0.1) in the file name: the installer itself can only carry three numbers.
          V=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          mkdir -p ../dist && cp "$(ls build/compose/binaries/main/msi/*.msi | head -1)" "../dist/Suslik Media-$V.msi"
          echo "MSI=$(ls ../dist/*.msi | head -1 | sed 's#^\.\./##')" >> "$GITHUB_ENV"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: windows-msi, path: dist/*.msi, retention-days: 2 }
      # «Suslik Debug» (detailed journal, installs next to the normal app, never published): see desktop/DEBUG-BUILD.md
      - name: Build debug MSI
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageMsi -Pdiag 2>&1 | tail -5
          V=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          mkdir -p ../dist-diag && cp "$(ls build/compose/binaries/main/msi/Suslik\ Debug*.msi | head -1)" "../dist-diag/Suslik Debug-$V.msi"
      - uses: actions/upload-artifact@v4
        with: { name: windows-debug-msi, path: dist-diag/*.msi, retention-days: 30 }
      - name: Publish to the site
        if: ${{ inputs.publish }}
        working-directory: .
        env: { UPDATE_TOKEN: "${{ secrets.UPDATE_TOKEN }}", SITE_URL: "${{ secrets.SITE_URL }}" }
        run: |
          # A server without the beta channel would ignore X-Channel and give the build to everyone: refuse then.
          if [ "${{ inputs.channel || 'beta' }}" = "beta" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Update-Token: $UPDATE_TOKEN" "$SITE_URL/api/app/reports?limit=1")
            if [ "$code" != "200" ]; then echo "::error::Сервер ещё без бета-канала (обновите website/server.js) — публикация отменена"; exit 1; fi
          fi
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "X-File-Name: $(basename "$MSI")" \
               -H "X-Channel: ${{ inputs.channel || 'beta' }}" \
               -H "Content-Type: application/octet-stream" --data-binary @"$MSI" "$SITE_URL/api/app/upload"
          # «Что нового» этой сборки — на сайт (вкладка «Приложения»)
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "Content-Type: application/json" \
               --data-binary @desktop/src/main/resources/changelog.json "$SITE_URL/api/app/changelog?platform=desktop"
