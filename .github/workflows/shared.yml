name: Shared core tests

# Unit tests of the code both apps share (shared/): changelog, versions, playback supervisor, local reserve.
on:
  push:
    paths: ["shared/**", ".github/workflows/shared.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: shared } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Test
        run: |
          set -o pipefail
          gradle --no-daemon test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report
        if: always()
        run: |
          grep -E "FAILED|Test.*>|expected|AssertionError|e: |error:" "$RUNNER_TEMP/test.log" | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            echo "::notice::$(basename "$f"): $(grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | head -1)"
          done
