name: Desktop Qt

# Новая ПК-версия на C++/Qt (desktop-qt/, план — docs/QT-PORT.md).
# На пуш с изменениями в desktop-qt/ — только тесты ядра на Linux (Qt из apt, пара минут).
# Сборка для Windows (MSVC + Qt 6.8) — только вручную, как android.yml и desktop.yml.
on:
  push:
    paths: ["desktop-qt/**", ".github/workflows/desktop-qt.yml"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Собрать для Windows"
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt и сборщик
        run: sudo apt-get update -q && sudo apt-get install -y -q qt6-base-dev qt6-declarative-dev qt6-shadertools-dev ninja-build
      - name: Сборка
        run: cmake -S desktop-qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build
      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true
      - name: Сборка
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          cmake -S desktop-qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Упаковка
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/SuslikMediaQt.exe dist/
          windeployqt --release --qmldir desktop-qt/app/qml --no-translations dist/SuslikMediaQt.exe
          # собственный модуль Suslik (Main.qml, Theme.qml, qmldir, типы): вшит в программу, копия рядом — запасной путь
          mkdir -p dist/qml/Suslik
          cp build/app/Suslik/qmldir build/app/Suslik/*.qmltypes dist/qml/Suslik/
          cp desktop-qt/app/qml/*.qml dist/qml/Suslik/
      # видеодвижок: та же сборка libmpv, что раздаёт сервер (desktop/.../libmpv.properties), проверка по SHA-256.
      # В установщике её не будет (качает MpvInstall), здесь — чтобы архив сборки сразу играл видео.
      - name: libmpv
        shell: bash
        run: |
          P=desktop/src/main/resources/libmpv.properties
          V=$(sed -n 's/^version=//p' $P); SHA=$(sed -n 's/^dllSha256=//p' $P)
          A=$(sed -n 's/.*(\(mpv-dev-x86_64-[^)]*\.7z\)).*/\1/p' $P)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mpv.7z" "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$V/$A"
          7z e -y -o"$RUNNER_TEMP/mpv" "$RUNNER_TEMP/mpv.7z" libmpv-2.dll >/dev/null
          echo "$SHA  $RUNNER_TEMP/mpv/libmpv-2.dll" | sha256sum -c -
          cp "$RUNNER_TEMP/mpv/libmpv-2.dll" dist/
      # программа открывает окно (без сервера — экран входа) и снимает его; не открылась — сборка красная
      - name: Проверка запуска
        shell: bash
        env:
          SUSLIK_SITE: http://127.0.0.1:9
          SUSLIK_APPDIR: ${{ runner.temp }}/sm-appdir
          SM_SHOT: ${{ runner.temp }}/sm-shot/start.png
          SM_SHOT_MS: "6000"
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          mkdir -p "$(dirname "$SM_SHOT")"
          timeout 60 dist/SuslikMediaQt.exe 2>&1 | tee start.log; rc=${PIPESTATUS[0]}
          echo "exit code: $rc"
          test "$rc" = 0 && test -s "$SM_SHOT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suslik-media-qt-start-shot
          path: ${{ runner.temp }}/sm-shot/
      - uses: actions/upload-artifact@v4
        with:
          name: suslik-media-qt-windows
          path: dist/
      # тесты после выгрузки: программу можно скачать и проверить, даже если тест упал (задание всё равно красное)
      - name: Тесты
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 90
      # тест упал на Windows: подробный ход упавших тестов (каждая проверка и сетевые события Qt), не дольше 2 мин на тест
      - name: Подробно об упавших тестах
        if: failure()
        shell: bash
        env:
          QT_LOGGING_RULES: "qt.network.*=true"
        run: |
          for t in $(ctest --test-dir build -N --rerun-failed 2>/dev/null | sed -n 's/.*Test *#[0-9]*: *//p'); do
            echo "::group::$t"
            timeout 120 build/tests/$t.exe -v2 2>&1 | tail -n 150 || true
            echo "::endgroup::"
          done
