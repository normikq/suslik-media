[package]
name = "suslik-desktop"
description = "Suslik Media для Windows на Rust (egui + mpv)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "suslik-media"
path = "src/main.rs"

[dependencies]
suslik-core = { path = "../suslik-core" }
# glow: OpenGL — тот же контекст потом отдаём mpv (render API), как сейчас MpvVideo.kt отдаёт GL Skiko.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
ureq = "2"
serde_json.workspace = true
flate2 = "1.1.10"

[features]
# Отладочная сборка «Suslik Debug»: своя папка данных %APPDATA%\SuslikMediaDebug (как -Pdiag у Kotlin-версии).
diag = []

[dev-dependencies]
