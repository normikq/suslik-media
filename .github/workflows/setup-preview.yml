name: Installer preview

# Снимки окон установщика ПК (desktop-qt/installer/setup) после каждой правки: артефакт setup-preview-qt с PNG.
# Ничего не ставит — программа запускается с /preview и рисует окна в файлы.
on:
  push:
    paths: ["desktop-qt/installer/setup/**", ".github/workflows/setup-preview.yml"]
  workflow_dispatch:

jobs:
  preview-qt:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop-qt/installer, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Build
        run: dotnet build setup/SuslikSetup.csproj -c Release -o "$RUNNER_TEMP/setup" 2>&1 | tail -5
      - name: Render
        env: { MSYS_NO_PATHCONV: "1" }
        run: |
          mkdir -p "$GITHUB_WORKSPACE/preview-qt"
          "$RUNNER_TEMP/setup/SuslikSetup.exe" /preview "$(cygpath -w "$GITHUB_WORKSPACE/preview-qt")" &
          wait $!
          ls -la "$GITHUB_WORKSPACE/preview-qt"
      - uses: actions/upload-artifact@v4
        with: { name: setup-preview-qt, path: preview-qt/*.png, retention-days: 7 }
