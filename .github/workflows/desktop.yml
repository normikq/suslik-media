name: Windows

# Только вручную (Actions → Run workflow или gh api …/dispatches): пуш больше не запускает сборку.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить установщик на сайт (папка updates/)"
        type: boolean
        default: false
      debug:
        description: "Собрать и отладочную «Suslik Debug» (артефакт, на сайт не идёт)"
        type: boolean
        default: false
      channel:
        description: "Кому: beta — только тестировщику (по коду), stable — всем"
        type: choice
        options: [beta, stable]
        default: beta

jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop, shell: bash } }
    # Домен сайта в сборку — только из секрета, в репозитории его нет (Gradle и установщик читают SITE_URL).
    env: { SITE_URL: "${{ secrets.SITE_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      # Окно удаления (desktop/setup без MSI внутри) кладётся в само приложение: app/resources/SuslikUninstall.exe
      - name: Build uninstaller
        run: |
          set -o pipefail
          V=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          dotnet build setup/SuslikSetup.csproj -c Release -p:AppVersion=$V -p:AssemblyName=SuslikUninstall -o "$RUNNER_TEMP/uninstall" 2>&1 | tail -5
          mkdir -p resources/windows && cp "$RUNNER_TEMP/uninstall/SuslikUninstall.exe" resources/windows/
          rm -rf setup/obj setup/bin
      - name: Build MSI
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageReleaseMsi 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Caused by|> .*" "$RUNNER_TEMP/build.log" | grep -v "^> Task" | head -40 |
            while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          echo "::error::--- tail ---"
          tail -25 "$RUNNER_TEMP/build.log" | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
      - name: Collect
        run: |
          # Full version (2.0.0.1) in the file name: the installer itself can only carry three numbers.
          V=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          mkdir -p ../dist && cp "$(ls build/compose/binaries/main-release/msi/*.msi | head -1)" "../dist/Suslik Media-$V.msi"
          echo "MSI=$(ls ../dist/*.msi | head -1 | sed 's#^\.\./##')" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"
      # Единственный файл для людей — «Suslik Media Setup.exe»: мастер с MSI внутри. Им же обновляется приложение
      # (запускает его с /update). Видеодвижок libmpv в нём нет: установщик качает его с нашего сервера (libmpv.properties).
      - name: Build installer
        run: |
          set -o pipefail
          URL="${SITE_URL%/}"   # домен и, если сервер не в корне, путь
          [ -n "$URL" ] || { echo "::error::Нет секрета SITE_URL"; exit 1; }
          dotnet build setup/SuslikSetup.csproj -c Release -p:AppVersion=$V -p:AssemblyName=SuslikMediaSetup "-p:SiteUrl=$URL" \
            "-p:MsiPath=$(cygpath -w "$GITHUB_WORKSPACE/$MSI")" -o "$RUNNER_TEMP/setup" 2>&1 | tail -5
          cp "$RUNNER_TEMP/setup/SuslikMediaSetup.exe" "../dist/Suslik Media Setup-$V.exe"
          rm -rf setup/obj setup/bin
          echo "SETUP=dist/Suslik Media Setup-$V.exe" >> "$GITHUB_ENV"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with: { name: windows-setup, path: dist/*.exe, retention-days: 7 }
      # «Suslik Debug» (detailed journal, installs next to the normal app, never published): see desktop/DEBUG-BUILD.md
      - name: Build debug MSI
        if: ${{ inputs.debug }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon packageMsi -Pdiag 2>&1 | tail -5
          V=$(sed -n 's/^val appVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          mkdir -p ../dist-diag && cp "$(ls build/compose/binaries/main/msi/Suslik\ Debug*.msi | head -1)" "../dist-diag/Suslik Debug-$V.msi"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug }}
        with: { name: windows-debug-msi, path: dist-diag/*.msi, retention-days: 2 }
      - name: Publish to the site
        if: ${{ inputs.publish }}
        working-directory: .
        env: { UPDATE_TOKEN: "${{ secrets.UPDATE_TOKEN }}", SITE_URL: "${{ secrets.SITE_URL }}" }
        run: |
          # A server without the beta channel would ignore X-Channel and give the build to everyone: refuse then.
          if [ "${{ inputs.channel || 'beta' }}" = "beta" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Update-Token: $UPDATE_TOKEN" "$SITE_URL/api/app/reports?limit=1")
            if [ "$code" != "200" ]; then echo "::error::Сервер ещё без бета-канала (обновите website/server.js) — публикация отменена"; exit 1; fi
          fi
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "X-File-Name: $(basename "$SETUP")" \
               -H "X-Channel: ${{ inputs.channel || 'beta' }}" \
               -H "Content-Type: application/octet-stream" --data-binary @"$SETUP" "$SITE_URL/api/app/upload"
          # «Что нового» этой сборки — на сайт (вкладка «Приложения»)
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "Content-Type: application/json" \
               --data-binary @desktop/src/main/resources/changelog.json "$SITE_URL/api/app/changelog?platform=desktop"
