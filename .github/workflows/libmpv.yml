name: libmpv

# libmpv-2.dll (видеодвижок mpv) не входит в MSI: установщик и приложение качают её отсюда один раз
# (desktop/src/main/resources/libmpv.properties → url). Правка этого файла выкладывает нужную версию в релиз
# libmpv-<version> (libmpv-2.dll.gz), если её там ещё нет. Контрольные суммы архива и самой библиотеки сверяются.
on:
  push:
    paths: ["desktop/src/main/resources/libmpv.properties", ".github/workflows/libmpv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish libmpv-2.dll.gz
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          P=desktop/src/main/resources/libmpv.properties
          get() { sed -n "s/^$1=//p" "$P" | tr -d '\r'; }
          V=$(get version); TAG="libmpv-$V"
          case "$(get url)" in */$TAG/libmpv-2.dll.gz) ;; *) echo "::error::url в $P должен вести на релиз $TAG"; exit 1;; esac
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx libmpv-2.dll.gz; then
            echo "$TAG уже выложен"; exit 0
          fi
          curl -fsSL -o mpv.7z "$(get archive)"
          echo "$(get archiveSha256)  mpv.7z" | sha256sum -c
          7z x -y -ox mpv.7z libmpv-2.dll > /dev/null
          echo "$(get dllSha256)  x/libmpv-2.dll" | sha256sum -c
          gzip -9 -n -c x/libmpv-2.dll > libmpv-2.dll.gz
          ls -la libmpv-2.dll.gz
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
            --title "libmpv $V" --notes "Видеодвижок mpv для Suslik Media (Windows). Ставится установщиком и приложением сам, вручную качать не нужно."
          gh release upload "$TAG" libmpv-2.dll.gz --clobber
          # Проверка: файл по ссылке из libmpv.properties отдаётся и распаковывается в ту же библиотеку
          curl -fsSL "$(get url)" | gunzip | sha256sum | grep -q "^$(get dllSha256) "
