name: Update status

# Что сервер сейчас раздаёт: версии релиза и беты, файлы в папках, версия server.js (rev).
on: workflow_dispatch

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the server
        env: { UPDATE_TOKEN: "${{ secrets.UPDATE_TOKEN }}", SITE_URL: "${{ secrets.SITE_URL }}" }
        run: |
          r=$(curl -sS -w "\nHTTP %{http_code}" -H "X-Update-Token: $UPDATE_TOKEN" "$SITE_URL/api/app/status")
          echo "$r"
          code=$(echo "$r" | tail -1)
          if [ "$code" = "HTTP 404" ]; then echo "::warning::На сервере старый server.js (нет /api/app/status) — он не понимает версии из 4 чисел"; fi
          echo "::notice::$(echo "$r" | head -1 | cut -c1-900)"
