name: Android APK

# Только вручную (Actions → Run workflow или gh api …/dispatches): пуш больше не запускает сборку.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Выложить APK на сайт (папка updates/)"
        type: boolean
        default: false
      debug:
        description: "Собрать и отладочную «Suslik Debug» (артефакт, на сайт не идёт)"
        type: boolean
        default: false
      channel:
        description: "Кому: beta — только тестировщику (по коду), stable — всем"
        type: choice
        options: [beta, stable]
        default: beta

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Signing key (if configured)
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=1" >> "$GITHUB_ENV"
          fi
      - name: Check the key alias
        if: env.HAS_KEY == '1'
        env:
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ALIAS=$(printf '%s' "$ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          LIST=$(keytool -list -keystore "$SIGNING_KEYSTORE" -storepass "$STORE_PW" 2>&1) || { echo "::error::Keystore: $(echo "$LIST" | head -3 | tr '\n' ' ') — проверьте ANDROID_STORE_PASSWORD"; exit 1; }
          FOUND=$(echo "$LIST" | grep -iE "PrivateKeyEntry" | cut -d, -f1)
          echo "::notice::Ключи в keystore: $(echo $FOUND)"
          if echo "$FOUND" | grep -qix "$ALIAS"; then USE="$ALIAS"
          else USE=$(echo "$FOUND" | head -1); echo "::warning::Алиас из ANDROID_KEY_ALIAS не найден, используется '$USE'"; fi
          echo "SIGNING_KEY_ALIAS=$USE" >> "$GITHUB_ENV"
      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          T=assembleDebug; [ "$HAS_KEY" = "1" ] && T=assembleRelease
          # + the debug build «Suslik Debug» (detailed journal, own package; DEBUG-BUILD.md) only when asked (input debug).
          D=; [ "${{ inputs.debug }}" = "true" ] && D=assembleDiag
          gradle --no-daemon $T $D 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build errors
        if: failure()
        run: |
          # Errors as annotations: readable through the GitHub API (job logs are not always reachable).
          grep -E "^e: |error:|What went wrong|Caused by|Missing class|> .*" "$RUNNER_TEMP/build.log" | grep -v "^> Task" | head -40 |
            while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
          echo "::error::--- tail ---"
          tail -25 "$RUNNER_TEMP/build.log" | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-900)"; done
      - name: Name the APK by version
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          C=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          F=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          # -b<versionCode>: Android installs by this number, not by the name — the app reads it from the file name.
          mkdir -p ../dist && cp "$F" "../dist/suslik-media-$V-b$C.apk"
          echo "APK=dist/suslik-media-$V-b$C.apk" >> "$GITHUB_ENV"
          if [ "${{ inputs.debug }}" = "true" ]; then mkdir -p ../dist-diag && cp app/build/outputs/apk/diag/*.apk "../dist-diag/suslik-debug-$V-b$C.apk"; fi
          ls -la ../dist ../dist-diag 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: dist/*.apk, retention-days: 2 }
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug }}
        with: { name: android-debug-apk, path: dist-diag/*.apk, retention-days: 2 }
      - name: Publish to the site
        if: ${{ inputs.publish && env.HAS_KEY == '1' }}
        working-directory: .
        env: { UPDATE_TOKEN: "${{ secrets.UPDATE_TOKEN }}", SITE_URL: "${{ secrets.SITE_URL }}" }
        run: |
          # A server without the beta channel would ignore X-Channel and give the build to everyone: refuse then.
          if [ "${{ inputs.channel || 'beta' }}" = "beta" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Update-Token: $UPDATE_TOKEN" "$SITE_URL/api/app/reports?limit=1")
            if [ "$code" != "200" ]; then echo "::error::Сервер ещё без бета-канала (обновите website/server.js) — публикация отменена"; exit 1; fi
          fi
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "X-File-Name: $(basename "$APK")" \
               -H "X-Channel: ${{ inputs.channel || 'beta' }}" \
               -H "Content-Type: application/octet-stream" --data-binary @"$APK" "$SITE_URL/api/app/upload"
          # «Что нового» этой сборки — на сайт (вкладка «Приложения»)
          curl -fsS -H "X-Update-Token: $UPDATE_TOKEN" -H "Content-Type: application/json" \
               --data-binary @android/app/src/main/assets/changelog.json "$SITE_URL/api/app/changelog?platform=android"
